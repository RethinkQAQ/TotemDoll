plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
    id 'com.github.hierynomus.license' version '0.16.1' apply false
}

subprojects {
    if (name ==~ /.+-(fabric|neoforge)/) {
        apply plugin: 'com.github.hierynomus.license'
        apply from: rootProject.file('license.gradle')
    }
}

tasks.register('licenseFormat') {
    group = 'formatting'
    description = 'Applies LGPL-3.0 headers to all source modules.'
    dependsOn(subprojects.collect { it.tasks.named('licenseFormat') })
}

tasks.register('licenseCheck') {
    group = 'verification'
    description = 'Checks LGPL-3.0 headers in all source modules.'
    dependsOn(subprojects.collect { it.tasks.named('license') })
}

def targetMatcher = (project.name =~ /^(.+)-(fabric|neoforge)$/)
if (targetMatcher.matches()) {
    def targetLoader = targetMatcher.group(2)
    def repositoryRootProject = rootProject

    apply plugin: 'multiloader-common'
    apply plugin: targetLoader == 'fabric' ? 'fabric-loom' : 'net.neoforged.moddev'

    // Keep the retained common/platform source layout while applying the
    // Stonecutter condition syntax before javac sees the files. Stonecutter
    // 0.7.x only wires its built-in merge task to the default src tree, so the
    // custom roots are merged here using the same target version selected by
    // Stonecutter.
    def sharedMain = [
            repositoryRootProject.file('common/src/main'),
            repositoryRootProject.file("${targetLoader}/src/main"),
            project.file('src/main')
    ]
    def mergedMain = file("${buildDir}/generated/totemdoll/main")
    def modernMinecraft = targetMatcher.group(1) == '1.21.4'
    def mergeMainSources = tasks.register('mergeTotemDollSources') {
        inputs.files(sharedMain)
        outputs.dir(mergedMain)
        doLast {
            delete(mergedMain)
            sharedMain.each { root ->
                fileTree(root).files.each { sourceFile ->
                    def relative = root.toPath().relativize(sourceFile.toPath()).toString()
                    def destination = new File(mergedMain, relative)
                    destination.parentFile.mkdirs()
                    if (sourceFile.name.endsWith('.java')) {
                        def output = []
                        def states = []
                        def enabled = true
                        sourceFile.eachLine('UTF-8') { line ->
                            if (line ==~ /\s*\/\*\?\s*if\s+>=1\.21\.4\s*\{\*\/\s*/) {
                                states << enabled
                                enabled = enabled && modernMinecraft
                            } else if (line ==~ /\s*\/\*\?\}\s*else\s*\{\*\/\s*/) {
                                enabled = states[-1] && !modernMinecraft
                            } else if (line ==~ /\s*\/\*\?\}\s*\*\/\s*/) {
                                enabled = states.remove(states.size() - 1)
                            } else if (enabled) {
                                output << line
                            }
                        }
                        if (!states.isEmpty()) {
                            throw new GradleException("Unclosed Stonecutter condition in ${sourceFile}")
                        }
                        destination.setText(output.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
                    } else {
                        destination.bytes = sourceFile.bytes
                    }
                }
            }
        }
    }
    sourceSets.main.java.setSrcDirs([new File(mergedMain, 'java')])
    sourceSets.main.resources.setSrcDirs([new File(mergedMain, 'resources')])
    tasks.named('compileJava') { dependsOn(mergeMainSources) }
    tasks.named('sourcesJar') { dependsOn(mergeMainSources) }
    tasks.named('processResources') {
        dependsOn(mergeMainSources)
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    dependencies {
        compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
        compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
        annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    }

    if (targetLoader == 'fabric') {
        dependencies {
            minecraft "com.mojang:minecraft:${minecraft_version}"
            mappings loom.layered {
                officialMojangMappings()
                parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
            }
            modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
        }

        loom {
            def aw = repositoryRootProject.file("common/src/main/resources/${mod_id}.accesswidener")
            if (aw.exists()) {
                accessWidenerPath.set(aw)
            }
            mixin {
                defaultRefmapName.set("${mod_id}.refmap.json")
            }
            runs {
                def defaultServer = findByName('server')
                if (defaultServer != null) {
                    remove(defaultServer)
                }
                client {
                    client()
                    setConfigName("Fabric Client ${minecraft_version}")
                    ideConfigGenerated(true)
                    runDir('runs/client')
                }
            }
        }
        tasks.matching { it.name == 'runServer' }.configureEach {
            enabled = false
            group = null
            description = 'Disabled: Totem Doll is a client-only mod.'
        }
    } else {
        neoForge {
            version = neoforge_version
            def at = repositoryRootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
            if (at.exists()) {
                accessTransformers.from(at.absolutePath)
            }
            parchment {
                minecraftVersion = parchment_minecraft
                mappingsVersion = parchment_version
            }
            runs {
                client {
                    client()
                    ideName = "NeoForge Client ${minecraft_version}"
                }
            }
            mods {
                "${mod_id}" {
                    sourceSet sourceSets.main
                }
            }
        }
    }
}
