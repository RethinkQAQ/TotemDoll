plugins {
    id 'java-library'
    id 'idea'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

sourceSets.main.java.srcDir('src/main/java')
sourceSets.main.resources.srcDir('src/main/resources')

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// IDE-only classpath: the real builds are the four Stonecutter targets.
dependencies {
    // Reuse the complete Loom classpath so Minecraft classes resolve in IDEA.
    compileOnly files(project(':1.21.1-fabric').configurations.compileClasspath)
}
