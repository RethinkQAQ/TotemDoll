name: Reusable Minecraft build

on:
  workflow_call:
    outputs:
      artifact_name:
        description: Internal staging artifact name
        value: ${{ jobs.build.outputs.artifact_name }}
      artifact_version:
        description: Build or release artifact version
        value: ${{ jobs.build.outputs.artifact_version }}
      publish_matrix:
        description: Per-loader and Minecraft-version publishing matrix
        value: ${{ jobs.build.outputs.publish_matrix }}

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft targets
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
      publish_matrix: ${{ steps.manifest.outputs.publish_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set build version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${GITHUB_REF_NAME#v}"
            artifact_version="$GITHUB_REF_NAME"
            build_suffix=""
          else
            base_version="$(sed -n 's/^mod\.version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n 1)"
            if [[ -z "$base_version" ]]; then
              echo "Missing mod.version in gradle.properties" >&2
              exit 1
            fi
            version="$base_version"
            artifact_version="${base_version}-build.${GITHUB_RUN_NUMBER}"
            build_suffix="build.${GITHUB_RUN_NUMBER}"
          fi

          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_SUFFIX=$build_suffix" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=$artifact_version" >> "$GITHUB_ENV"
          echo "artifact_name=mod-jars-staging" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - name: Validate registered version metadata
        run: ./gradlew validateVersionProperties --no-daemon --stacktrace

      - name: Build all targets
        run: |
          ./gradlew build \
            -Pmod.version="$BUILD_VERSION" \
            -Pbuild.number="$BUILD_SUFFIX" \
            --parallel \
            --build-cache \
            --no-daemon \
            --stacktrace

      - name: Collect jars and generate manifests
        id: manifest
        shell: bash
        run: python3 .github/scripts/collect_artifacts.py

      - name: Upload combined build artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: combined-artifacts/*.jar
          if-no-files-found: error

      - name: Package release mod jars
        if: github.event_name == 'release'
        shell: bash
        run: |
          rm -f mod-jars.zip
          zip -j -q mod-jars.zip combined-artifacts/*.jar
          unzip -Z1 mod-jars.zip

      - name: Upload release mod jars ZIP
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: mod-jars.zip
          if-no-files-found: error

      - name: Upload release staging artifact
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/
          if-no-files-found: error

  upload-artifacts:
    name: Upload ${{ matrix.group }} artifact
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.publish_matrix) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Upload versioned artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars-${{ matrix.group }}
          path: artifacts/${{ matrix.path }}/
          if-no-files-found: error
