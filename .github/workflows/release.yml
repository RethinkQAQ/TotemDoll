name: Release Totem Doll

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-mods.yml

  publish-platforms:
    name: Publish ${{ matrix.group }}
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.publish_matrix) }}
    steps:
      - name: Download release staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Check publishing configuration
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$MODRINTH_TOKEN" || { echo 'Missing MODRINTH_TOKEN'; exit 1; }
          test -n "$CURSEFORGE_TOKEN" || { echo 'Missing CURSEFORGE_TOKEN'; exit 1; }

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: CcfJqGL2
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1641634
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: artifacts/${{ matrix.path }}/*.jar
          name: ${{ github.event.release.name || github.ref_name }} for Minecraft ${{ matrix.minecraft_version }}
          version: ${{ matrix.platform_version }}
          version-type: release
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.game_versions }}
          game-version-filter: none
          changelog: ${{ github.event.release.body }}
