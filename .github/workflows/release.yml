name: Release Totem Doll

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-mods.yml

  upload-release-assets:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: artifacts

      - name: Upload jars to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r -d '' jar; do
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          done < <(find artifacts -type f -name '*.jar' -print0)

