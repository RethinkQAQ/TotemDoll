name: Build Totem Doll

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version, for example 0.1-alpha'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set build version
        shell: bash
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            echo "BUILD_VERSION=${{ inputs.release_version }}" >> "$GITHUB_ENV"
            echo "BUILD_SUFFIX=" >> "$GITHUB_ENV"
            echo "ARTIFACT_VERSION=${{ inputs.release_version }}" >> "$GITHUB_ENV"
          else
            echo "BUILD_VERSION=0.1.1-alpha" >> "$GITHUB_ENV"
            echo "BUILD_SUFFIX=build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
            echo "ARTIFACT_VERSION=0.1.1-alpha.build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build all targets
        run: |
          ./gradlew licenseFormat --no-daemon
          ./gradlew build -Pmod.version="$BUILD_VERSION" -Pbuild.number="$BUILD_SUFFIX" --no-daemon --stacktrace

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          find fabric neoforge -type f -path '*/build/libs/*.jar' \
            \( -name 'totemdoll-fabric-*.jar' -o -name 'totemdoll-neoforge-*.jar' \) \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            ! -name '*-dev.jar' \
            -exec cp {} artifacts/ \;

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        with:
          name: Totem-Doll-${{ env.ARTIFACT_VERSION }}
          path: artifacts/*.jar
          if-no-files-found: error
